<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZAL : 잘될 — 사내외 통합 인재 프로필 DB 및 제안·소싱 관리 플랫폼</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app-layout">
    <!-- Left Navigation Rail (Identical to 잘됨 LeftNavRail) -->
    <aside class="left-nav-rail" id="leftNavRail">
      <div class="rail-top-group">
        <button type="button" class="rail-btn active" data-tab="dashboard" onclick="switchTab('dashboard')">
          <div class="rail-icon-box">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2.2L7.5 4.8v4.8L12 12.2l4.5-2.6V4.8L12 2.2z"/>
              <path d="M7.5 4.8L12 7.4l4.5-2.6"/>
              <path d="M12 7.4v4.8"/>
              <path d="M7.5 12.2L3 14.8v4.8l4.5 2.6 4.5-2.6v-4.8L7.5 12.2z"/>
              <path d="M3 14.8l4.5 2.6 4.5-2.6"/>
              <path d="M7.5 17.4v4.8"/>
              <path d="M16.5 12.2L12 14.8v4.8l4.5 2.6 4.5-2.6v-4.8L16.5 12.2z"/>
              <path d="M12 14.8l4.5 2.6 4.5-2.6"/>
              <path d="M16.5 17.4v4.8"/>
            </svg>
          </div>
          <span class="rail-label">대시보드</span>
        </button>

        <button type="button" class="rail-btn" data-tab="profiles" onclick="switchTab('profiles')">
          <div class="rail-icon-box">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
          </div>
          <span class="rail-label">인재 DB</span>
        </button>

        <button type="button" class="rail-btn" data-tab="projects" onclick="switchTab('projects')">
          <div class="rail-icon-box">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
            </svg>
          </div>
          <span class="rail-label">제안·매칭</span>
        </button>

        <button type="button" class="rail-btn" data-tab="sourcing" onclick="switchTab('sourcing')">
          <div class="rail-icon-box">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
            </svg>
          </div>
          <span class="rail-label">구인·소싱</span>
        </button>

        <button type="button" class="rail-btn" data-tab="interviews" onclick="switchTab('interviews')">
          <div class="rail-icon-box">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
          </div>
          <span class="rail-label">면접·검증</span>
        </button>

        <button type="button" class="rail-btn" id="openMyProfileBtn" title="내 프로필 및 가용일 현행화">
          <div class="rail-icon-box">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </div>
          <span class="rail-label">마이페이지</span>
        </button>
      </div>

      <div class="rail-bottom-group">
        <button type="button" class="rail-btn" data-tab="permissions" onclick="switchTab('permissions')" title="권한 체계 및 선별 권한 설정">
          <div class="rail-icon-box">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </div>
          <span class="rail-label">권한 설정</span>
        </button>
      </div>
    </aside>

    <!-- Main Scrollable Area -->
    <div class="main-scroll-area" id="mainScrollArea">
      <!-- Top Morning Greeting + Mascot + AI Prompt Bar -->
      <div class="zal-top-header-wrap">
        <div class="zal-greeting-row">
          <div class="zal-greeting-left">
            <span class="zal-date-label" id="todayDateLabel">2026년 11월 13일 금요일</span>
            <div class="zal-title-tags-row">
              <h2 class="zal-greeting-title" id="greetingTitle">김태호 상무님, 잘될이와 뭐든 잘되는 하루 :-)</h2>
              <div class="zal-hashtag-group">
                <button type="button" class="zal-hashtag-btn" onclick="triggerSampleParse('sample1')">#AI이력서파싱</button>
                <button type="button" class="zal-hashtag-btn" onclick="switchTab('projects')">#RFP적임자매칭</button>
                <button type="button" class="zal-hashtag-btn" onclick="openProposalSheetModal('prj_1')">#제안장표추출</button>
                <button type="button" class="zal-hashtag-btn" onclick="switchTab('sourcing')">#외주타겟소싱</button>
                <button type="button" class="zal-hashtag-btn" onclick="switchTab('interviews')">#필수질문면접</button>
              </div>
            </div>
          </div>

          <!-- Right: User Switcher Pill & Project Selector Pill (Identical to 잘됨) -->
          <div class="zal-top-controls-right">
            <!-- User Avatar & Role Switcher -->
            <div class="zal-user-pill-wrap">
              <img id="currentUserAvatar" src="/pic1_thumb.png" alt="avatar" class="zal-mini-avatar" />
              <select id="userRoleSelect" class="zal-clean-select" title="계정 / 역할 권한 전환"></select>
            </div>

            <!-- Active Project Quick Selector -->
            <div class="zal-project-pill-wrap">
              <select id="headerProjectSelect" class="zal-clean-select" onchange="handleHeaderProjectChange(this.value)">
                <option value="ALL">미래금융 퇴직연금 차세대 외 전체</option>
                <option value="prj_1">미래금융 퇴직연금 차세대 구축</option>
                <option value="prj_2">대한자산운용 채권·펀드 수탁 고도화</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <!-- Peeking Mascot (bi2.png) & Rounded Pill AI Input Bar -->
      <div class="zal-composer-outer">
        <div class="zal-composer-inner">
          <img src="/bi2.png" alt="잘될이 캐릭터" class="zal-peeking-mascot" />

          <div class="zal-composer-box" id="zalComposerBox">
            <input
              type="text"
              id="aiQuickInput"
              class="zal-composer-input"
              placeholder="이력서 텍스트를 붙여넣거나 우측 클립으로 파일 업로드, 또는 '퇴직연금 특급 개발자 추천해줘'를 입력해 보세요"
              onkeydown="if(event.key==='Enter'){handleQuickAiInput();}"
            />
            <label class="zal-clip-btn" title="이력서 파일 업로드 (.pdf, .docx, .xlsx, .txt)">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
              </svg>
              <input type="file" id="headerResumeFileInput" accept=".pdf,.doc,.docx,.xls,.xlsx,.txt" style="display:none;" onchange="handleResumeFileUpload(event)" />
            </label>
            <button type="button" class="zal-send-btn" onclick="handleQuickAiInput()" title="AI 잘될이 실행 (Enter)">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Sticky Filter Tabs Bar (Identical to 잘됨: 전체 피드 | 인재 DB | 제안·매칭 | 구인·소싱 | 면접·검증 | 권한 설정) -->
      <div class="zal-sticky-tabs-bar">
        <div class="zal-sticky-tabs-inner">
          <div class="zal-tabs-list" id="mainNav">
            <button type="button" class="nav-tab toggle-item active" data-tab="dashboard">전체 피드</button>
            <button type="button" class="nav-tab toggle-item" data-tab="profiles">사내외 인재 DB</button>
            <button type="button" class="nav-tab toggle-item" data-tab="projects">프로젝트·제안서</button>
            <button type="button" class="nav-tab toggle-item" data-tab="sourcing">외주 구인·소싱</button>
            <button type="button" class="nav-tab toggle-item" data-tab="interviews">
              면접·필수질문
              <span class="red-dot"></span>
            </button>
            <button type="button" class="nav-tab toggle-item" data-tab="permissions">권한·민감정보</button>
          </div>

          <!-- Permission Status Summary Pill on the Right of Tabs -->
          <div id="permissionStrip" class="zal-perm-summary"></div>
        </div>
      </div>

      <!-- Sub-header Bar: Date / Quick Filter Checkboxes on Left + Rounded Black/White Member/Role Chips on Right -->
      <div class="zal-subheader-bar">
        <div class="zal-subheader-left">
          <div class="zal-date-nav">
            <span class="zal-date-nav-arrow">‹</span>
            <strong class="zal-date-nav-text">11월 13일(금)</strong>
            <span class="zal-date-nav-arrow">›</span>
          </div>

          <button type="button" class="zal-check-pill active" onclick="triggerSampleParse('sample1')">
            <span class="check-circle">✓</span> AI 무정차 이력서 파싱
          </button>
          <button type="button" class="zal-check-pill active" onclick="openProposalSheetModal('prj_1')">
            <span class="check-circle">✓</span> 제안서 총괄표 원클릭 추출
          </button>
        </div>

        <div class="zal-member-chips" id="quickRoleChips"></div>
      </div>

      <!-- Main Content Container -->
      <main class="main-container">
        <section id="tab-dashboard" class="tab-panel active"></section>
        <section id="tab-profiles" class="tab-panel"></section>
        <section id="tab-projects" class="tab-panel"></section>
        <section id="tab-sourcing" class="tab-panel"></section>
        <section id="tab-interviews" class="tab-panel"></section>
        <section id="tab-permissions" class="tab-panel"></section>
      </main>
    </div>
  </div>

  <!-- Modal Container -->
  <div id="modalBackdrop" class="modal-backdrop hidden">
    <div id="modalDialog" class="modal-dialog">
      <div class="modal-header">
        <h3 id="modalTitle">모달 제목</h3>
        <button id="modalCloseBtn" class="modal-close-btn">&times;</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container"></div>

  <script src="/app.js"></script>
</body>
</html>
